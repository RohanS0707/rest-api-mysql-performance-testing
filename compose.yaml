services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-shop_api_test}
      MYSQL_USER: ${DB_USER:-shop_test}
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-db-password-change-me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local-root-password-change-me}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build: .
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-shop_api_test}
      DB_USER: ${DB_USER:-shop_test}
      DB_PASSWORD: ${DB_PASSWORD:-local-db-password-change-me}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-local-admin-token-change-me}
      READONLY_API_TOKEN: ${READONLY_API_TOKEN:-local-read-token-change-me}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  mysql_data:
